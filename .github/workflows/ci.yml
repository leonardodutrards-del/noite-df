name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test payment route in production
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/payment-response.txt --write-out '%{http_code}' \
            --request POST 'https://www.noitedf.com.br/api/payments/subscriptions' \
            --header 'content-type: application/json' \
            --data '{"planId":"pro"}')"
          cat /tmp/payment-response.txt
          echo
          echo "HTTP_STATUS=$status"
          test "$status" = "401"
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build